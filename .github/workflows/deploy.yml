name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci, not npm install: it installs exactly what the lockfile
      # records and fails if package.json and the lockfile disagree, so a
      # deploy cannot quietly pick up a different dependency tree than the
      # one that was tested.
      - run: npm ci
      # The drift check does not run here any more. The setup guides are
      # generated from docs/ in ciyalabs/biryar, which is private, and a
      # workflow's GITHUB_TOKEN is scoped to the repository it runs in —
      # so this deploy cannot read that one without a long-lived personal
      # access token kept in these secrets.
      #
      # It runs in the product repository instead, in .github/workflows/
      # docs.yml: that workflow checks out *this* repository, which is
      # public and needs no credential, and runs the generator below
      # against its own checkout. The check is unchanged, there is no
      # token anywhere, and it now fails in the pull request that
      # changed the document rather than in a deploy days later.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
