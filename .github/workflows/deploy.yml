name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci, not npm install: it installs exactly what the lockfile
      # records and fails if package.json and the lockfile disagree, so a
      # deploy cannot quietly pick up a different dependency tree than the
      # one that was tested.
      - run: npm ci
      # The setup guides are generated from docs/ in ciyalabs/biryar. This
      # fails the deploy if the committed copies have fallen behind, which
      # is the whole reason they are generated: the public SP-API page once
      # described a flow the product had already replaced.
      - run: npm run check-docs
        env:
          # DOCS_TOKEN is a fine-grained personal access token with
          # read-only Contents on ciyalabs/biryar. It is required, not an
          # optimisation: that repository is private, and a workflow's
          # own GITHUB_TOKEN is scoped to the repository it runs in, so
          # it cannot read another one. Without the secret this step
          # fails with a 404, which is what a missing token looks like
          # from the other side of a private repository.
          GITHUB_TOKEN: ${{ secrets.DOCS_TOKEN }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
